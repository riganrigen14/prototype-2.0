<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi - SMPN 16 Palu</title>
    <!-- Font Poppins untuk tampilan modern -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            /* Latar belakang silver/abu-abu halus menyesuaikan bingkai logo */
            background: linear-gradient(135deg, #e0e5ec 0%, #f4f7f6 100%); 
            min-height: 100vh;
            margin: 0;
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
        }
        .card { 
            background: #ffffff; 
            width: 100%; 
            max-width: 420px; 
            padding: 35px 25px; 
            border-radius: 16px; 
            /* Bayangan sedikit lebih tegas */
            box-shadow: 0 10px 30px rgba(10, 27, 84, 0.15); 
            box-sizing: border-box;
            border-top: 6px solid #0a1b54; /* Aksen biru tua di atas kartu */
        }
        .logo-sekolah {
            width: 110px;
            height: auto;
            display: block;
            margin: 0 auto 15px auto;
            /* Memberikan efek bayangan tipis pada logo agar lebih menyatu */
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.1));
        }
        h2 { 
            text-align: center; 
            /* Warna Biru Tua dari logo */
            color: #0a1b54; 
            margin: 0 0 5px 0; 
            font-weight: 700;
            font-size: 22px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
            margin-top: 0;
        }
        label { 
            font-weight: 600; 
            font-size: 13px; 
            color: #0a1b54; 
            display: block; 
            margin-top: 15px; 
            margin-bottom: 5px;
        }
        input[type="text"], select { 
            width: 100%; 
            padding: 12px 15px; 
            border: 1.5px solid #bdc3c7; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 14px; 
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }
        /* Efek saat form diisi akan menyala dengan warna biru tua logo */
        input[type="text"]:focus, select:focus {
            border-color: #0a1b54;
            outline: none;
            box-shadow: 0 0 8px rgba(10, 27, 84, 0.2);
        }
        .file-upload-wrapper {
            position: relative;
            margin-top: 5px;
        }
        input[type="file"] { 
            width: 100%; 
            padding: 10px; 
            background: #f8f9fa; 
            border: 1.5px dashed #0a1b54;
            border-radius: 8px;
            cursor: pointer; 
            font-size: 13px;
            color: #333;
        }
        button { 
            width: 100%;
            /* Warna dominan biru tua logo */
            background: #0a1b54; 
            color: white; 
            border: none; 
            padding: 14px;
            border-radius: 8px;
            font-weight: 600; 
            font-size: 16px; 
            cursor: pointer; 
            margin-top: 25px; 
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }
        /* Saat tombol disorot, berubah menjadi Kuning Emas dari logo */
        button:hover { 
            background: #ffcc00; 
            color: #0a1b54;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 204, 0, 0.4);
        }
        #loading { 
            display: none; 
            text-align: center; 
            color: #0a1b54; 
            margin-top: 15px; 
            font-weight: 600; 
            font-size: 14px;
        }
        #preview { 
            display: none; 
            width: 100%; 
            margin-top: 15px; 
            border-radius: 8px;
            border: 2px solid #e0e5ec;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- Pastikan nama file ini sama persis dengan yang ada di GitHub Anda -->
    <img src="logo.png" alt="Logo SMPN 16 Palu" class="logo-sekolah">
    
    <h2>Presensi Kehadiran</h2>
    <p class="subtitle">SMP Negeri 16 Palu</p>

    <form id="absenForm">
        <label for="nama">Nama Lengkap Siswa:</label>
        <input type="text" id="nama" placeholder="Ketik nama lengkap..." required>

        <label for="kelas">Kelas:</label>
        <!-- Anda bisa mengubah atau menambah pilihan kelas sesuai kebutuhan -->
        <select id="kelas" required>
            <option value="" disabled selected>-- Pilih Kelas --</option>
            <option value="VII A">VII A</option>
            <option value="VII B">VII B</option>
            <option value="VII C">VII C</option>
            <option value="VII C">VII D</option>
            <option value="VII C">VII E</option>
            <option value="VIII A">VIII A</option>
            <option value="VIII B">VIII B</option>
            <option value="VIII C">VIII C</option>
            <option value="VIII C">VIII D</option>
            <option value="VIII C">VIII E</option>
            <option value="IX A">IX A</option>
            <option value="IX B">IX B</option>
            <option value="IX C">IX C</option>
            <option value="IX C">IX D</option>
            <option value="IX C">IX E</option>
        </select>

        <label for="foto">Foto Bukti Kehadiran (Selfie):</label>
        <div class="file-upload-wrapper">
            <input type="file" id="foto" accept="image/*" capture="user" required>
        </div>
        
        <img id="preview" alt="Preview Foto">

        <button type="submit" id="submitBtn">Kirim Presensi</button>
        <div id="loading">Memproses data... Mohon tunggu.</div>
    </form>
</div>

<script>
    document.getElementById('foto').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('preview');
                img.src = e.target.result;
                img.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    });

    document.getElementById('absenForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        
        // PENTING: JANGAN LUPA GANTI URL INI DENGAN URL GOOGLE APPS SCRIPT ANDA
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyUGWTYSQBlr99xQtohwOktN7p8XF5sDOQbT3QuSioSR63QyO5Z2ZM77jw7ISJXHN4h/exec";

        const nama = document.getElementById('nama').value;
        const kelas = document.getElementById('kelas').value;
        const file = document.getElementById('foto').files[0];

        if (!file) {
            alert("Harap ambil foto terlebih dahulu!");
            return;
        }

        btn.style.display = 'none';
        loading.style.display = 'block';

        const reader = new FileReader();
        reader.onload = async function() {
            const base64Data = reader.result;

            const payload = {
                nama: nama,
                kelas: kelas,
                foto: base64Data
            };

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { "Content-Type": "text/plain;charset=utf-8" }
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    alert("✅ Berhasil! Data kehadiran Anda sudah tersimpan.");
                    document.getElementById('absenForm').reset();
                    document.getElementById('preview').style.display = 'none';
                } else {
                    alert("❌ Error: " + result.message);
                }
            } catch (error) {
                alert("Gagal terhubung. Pastikan internet Anda aktif.");
                console.error(error);
            } finally {
                btn.style.display = 'block';
                loading.style.display = 'none';
            }
        };
        
        reader.readAsDataURL(file);
    });
</script>

</body>
</html>
